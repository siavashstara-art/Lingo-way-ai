name: Android Build & Release (APK & AAB)

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Choose build output type (apk, aab, or both)'
        required: true
        default: 'both'
        type: choice
        options:
          - 'apk'
          - 'aab'
          - 'both'

permissions:
  contents: write

jobs:
  build:
    name: Build Web Bundle & Android APK / AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm install --no-audit --no-fund

      - name: Build Production Web Bundle (dist)
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify Web Assets Directory for Android
        run: |
          mkdir -p android/app/src/main/assets
          ls -la dist/

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7 (No gradlew binary required)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Signing Keystore (if not provided via Secrets)
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore android/app/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=EnglishLingou, OU=Mobile, O=AbleWayCity, L=Tehran, S=Tehran, C=IR"
          fi

      # Build APK (Signed Release & Debug APK)
      - name: Assemble Android APK
        if: ${{ github.event.inputs.build_type == 'apk' || github.event.inputs.build_type == 'both' || github.event_name == 'push' }}
        working-directory: android
        run: gradle assembleRelease assembleDebug --no-daemon --stacktrace

      # Build AAB (Google Play Store / Cafe Bazaar Bundle)
      - name: Bundle Android AAB
        if: ${{ github.event.inputs.build_type == 'aab' || github.event.inputs.build_type == 'both' || github.event_name == 'push' }}
        working-directory: android
        run: gradle bundleRelease --no-daemon --stacktrace

      # Upload Artifacts (APK)
      - name: Upload APK Artifacts
        if: ${{ github.event.inputs.build_type == 'apk' || github.event.inputs.build_type == 'both' || github.event_name == 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: english-lingou-android-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30

      # Upload Artifacts (AAB)
      - name: Upload AAB Bundle Artifact
        if: ${{ github.event.inputs.build_type == 'aab' || github.event.inputs.build_type == 'both' || github.event_name == 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: english-lingou-android-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 30

      # Automatic GitHub Release if tag v*.*.* is pushed
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
