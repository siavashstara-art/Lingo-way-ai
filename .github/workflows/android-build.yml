name: Self-Healing Android APK & AAB Builder

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Output package type (apk, aab, or both)'
        required: true
        default: 'both'
        type: choice
        options:
          - 'apk'
          - 'aab'
          - 'both'

permissions:
  contents: write

jobs:
  android-release:
    name: Auto-Heal & Build Android (APK + AAB)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 22 (No Lockfile Cache Error)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Install Web Dependencies & Build Vite Bundle
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npx vite build --base=./
          ls -la dist/

      - name: 4. Auto-Generate & Repair Complete Android Project Structure
        run: |
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/layout
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/java/com/siavashstara/englishlingou

          # Copy built web bundle directly into Android assets
          cp -r dist/* android/app/src/main/assets/

          # 4.1 settings.gradle with pluginManagement
          cat << 'EOF' > android/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          include ':app'
          rootProject.name = 'English-lingou'
          EOF

          # 4.2 gradle.properties
          cat << 'EOF' > android/gradle.properties
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          android.nonTransitiveRClass=true
          EOF

          # 4.3 Root build.gradle
          cat << 'EOF' > android/build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.3.1'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # 4.4 Vector App Icon (Prevents AAPT2 missing mipmap/ic_launcher crash)
          cat << 'EOF' > android/app/src/main/res/drawable/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#047857" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#065F46" android:pathData="M54,54m-42,0a42,42 0,1 1,84 0a42,42 0,1 1,-84 0" />
              <path android:fillColor="#FBBF24" android:pathData="M54,24L63,43L84,46L69,61L72,82L54,72L36,82L39,61L24,46L45,43Z" />
          </vector>
          EOF

          # 4.5 AndroidManifest.xml (Uses @drawable/ic_launcher)
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.EnglishLingou"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 4.6 MainActivity.kt with WebViewAssetLoader
          cat << 'EOF' > android/app/src/main/java/com/siavashstara/englishlingou/MainActivity.kt
          package com.siavashstara.englishlingou

          import android.annotation.SuppressLint
          import android.os.Bundle
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebResourceResponse
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.activity.OnBackPressedCallback
          import androidx.appcompat.app.AppCompatActivity
          import androidx.webkit.WebViewAssetLoader

          class MainActivity : AppCompatActivity() {
              private lateinit var webView: WebView

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  webView = findViewById(R.id.webview)

                  val assetLoader = WebViewAssetLoader.Builder()
                      .addPathHandler("/assets/", WebViewAssetLoader.AssetsPathHandler(this))
                      .build()

                  val settings: WebSettings = webView.settings
                  settings.javaScriptEnabled = true
                  settings.domStorageEnabled = true
                  settings.databaseEnabled = true
                  settings.allowFileAccess = true
                  settings.allowContentAccess = true
                  settings.mediaPlaybackRequiresUserGesture = false

                  webView.webViewClient = object : WebViewClient() {
                      override fun shouldInterceptRequest(
                          view: WebView,
                          request: WebResourceRequest
                      ): WebResourceResponse? {
                          return assetLoader.shouldInterceptRequest(request.url)
                      }
                  }
                  webView.webChromeClient = WebChromeClient()
                  webView.loadUrl("https://appassets.androidplatform.net/assets/index.html")

                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          if (this@MainActivity::webView.isInitialized && webView.canGoBack()) {
                              webView.goBack()
                          } else {
                              isEnabled = false
                              onBackPressedDispatcher.onBackPressed()
                          }
                      }
                  })
              }
          }
          EOF

          # 4.7 app/build.gradle
          cat << 'EOF' > android/app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.siavashstara.englishlingou'
              compileSdk 34

              defaultConfig {
                  applicationId "com.siavashstara.englishlingou"
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName "2.0.0"
                  vectorDrawables {
                      useSupportLibrary true
                  }
              }

              signingConfigs {
                  release {
                      storeFile file("debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                      signingConfig signingConfigs.release
                  }
                  debug {
                      applicationIdSuffix ".debug"
                      debuggable true
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.activity:activity-ktx:1.8.2'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.webkit:webkit:1.10.0'
          }
          EOF

      - name: 5. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 6. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 7. Generate Signing Keystore Automatically
        run: |
          rm -f android/app/debug.keystore
          keytool -genkeypair -v \
            -keystore android/app/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=EnglishLingou, OU=Mobile, O=AbleWayCity, L=Tehran, S=Tehran, C=IR"

      - name: 8. Setup Gradle 8.7 Engine (Without Needing gradlew File)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 9. Build Signed Release APK & AAB Bundle
        working-directory: android
        run: |
          gradle assembleRelease bundleRelease --no-daemon --stacktrace

      - name: 10. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: english-lingou-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: 11. Upload AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: english-lingou-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: 12. Publish GitHub Release (on Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
